<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Live Dashboard</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --border: #223140;
      --text: #e6edf3;
      --muted: #8b98a5;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .subtitle, .status {
      color: var(--muted);
      font-size: 13px;
    }

    #refresh-btn {
      padding: 8px 14px;
      color: var(--text);
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }

    #refresh-btn:hover {
      border-color: var(--blue);
    }

    section {
      margin-top: 30px;
    }

    section h2 {
      margin: 0 0 14px;
      padding-bottom: 8px;
      font-size: 17px;
      border-bottom: 1px solid var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .card h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .price {
      margin-bottom: 8px;
      font-size: 25px;
      font-weight: 700;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .news-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .news-item:last-child {
      border-bottom: 0;
    }

    .news-item a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .news-item a:hover {
      color: var(--blue);
    }

    .news-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }

      .top-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      #refresh-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <div>
      <h1>Crypto Live Dashboard</h1>
      <div class="subtitle">
        Live market data, DeFi TVL, and news — auto-refresh every 60 seconds
      </div>
    </div>

    <button id="refresh-btn" onclick="loadAll()">Refresh now</button>
  </div>

  <div id="status" class="status">Loading live data…</div>

  <section>
    <h2>Live Market</h2>
    <div id="market-grid" class="grid"></div>
  </section>

  <section>
    <h2>DeFi TVL by Chain</h2>

    <table>
      <thead>
        <tr>
          <th>Chain</th>
          <th>TVL</th>
          <th>Token</th>
        </tr>
      </thead>
      <tbody id="tvl-body"></tbody>
    </table>
  </section>

  <section>
    <h2>Latest News</h2>
    <div id="news-list"></div>
  </section>

  <script>
    function formatUsd(value) {
      if (value === null || value === undefined) return "—";

      return "$" + Number(value).toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return "—";

      const number = Number(value);
      const cssClass = number >= 0 ? "pos" : "neg";
      const sign = number >= 0 ? "+" : "";

      return `<span class="${cssClass}">${sign}${number.toFixed(2)}%</span>`;
    }

    async function loadMarket() {
      const response = await fetch("/api/live-market");

      if (!response.ok) {
        throw new Error("Could not load market data");
      }

      const rows = await response.json();
      const grid = document.getElementById("market-grid");

      grid.innerHTML = rows.map((row) => `
        <article class="card">
          <h3>${row.symbol}</h3>
          <div class="price">${formatUsd(row.price_usd)}</div>

          <div class="row">
            <span>24h</span>
            <span>${formatPercent(row.change_24h_pct)}</span>
          </div>

          <div class="row">
            <span>7d</span>
            <span>${formatPercent(row.change_7d_pct)}</span>
          </div>

          <div class="row">
            <span>30d</span>
            <span>${formatPercent(row.change_30d_pct)}</span>
          </div>

          <div class="row">
            <span>Volume 24h</span>
            <span>${formatUsd(row.volume_24h_usd)}</span>
          </div>

          <div class="row">
            <span>From ATH</span>
            <span>${formatPercent(row.ath_change_pct)}</span>
          </div>
        </article>
      `).join("");
    }

    async function loadTvl() {
      const response = await fetch("/api/defi/tvl");

      if (!response.ok) {
        throw new Error("Could not load DeFi TVL data");
      }

      const rows = await response.json();
      const tbody = document.getElementById("tvl-body");

      rows.sort((a, b) => (b.tvl_usd || 0) - (a.tvl_usd || 0));

      tbody.innerHTML = rows.map((row) => `
        <tr>
          <td>${row.name}</td>
          <td>${formatUsd(row.tvl_usd)}</td>
          <td>${row.token_symbol || "—"}</td>
        </tr>
      `).join("");
    }

    async function loadNews() {
      const response = await fetch("/api/news");

      if (!response.ok) {
        throw new Error("Could not load news");
      }

      const rows = await response.json();
      const list = document.getElementById("news-list");

      list.innerHTML = rows.slice(0, 15).map((item) => `
        <article class="news-item">
          <a href="${item.url}" target="_blank" rel="noopener noreferrer">
            ${item.title}
          </a>

          <div class="news-meta">
            ${item.source} · ${item.published}
          </div>
        </article>
      `).join("");
    }

    async function loadAll() {
      const status = document.getElementById("status");
      const button = document.getElementById("refresh-btn");

      status.textContent = "Refreshing live data…";
      button.disabled = true;

      try {
        await Promise.all([
          loadMarket(),
          loadTvl(),
          loadNews()
        ]);

        status.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = `Error loading data: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    loadAll();
    setInterval(loadAll, 60000);
  </script>
</body>
</html>
